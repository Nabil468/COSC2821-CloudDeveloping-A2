<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Student Records Portal</title>
  <style>
    body { font-family: Arial; margin: 40px; background: #f5f5f5; }
    h2 { color: #333; }
    input, button { margin: 5px; padding: 8px; }
    textarea { width: 100%; height: 120px; margin-top: 10px; }
    .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 0 4px #ccc; }
  </style>
</head>
<body>
  <h2>CloudGuru Student Record System</h2>

  <!-- Search All -->
  <div class="section">
    <h3>Search All Records</h3>
    <button onclick="searchAll()">Search All</button>
  </div>

  <!-- Search by Name & Year -->
  <div class="section">
    <h3>Search by Student Name & Year</h3>
    <input id="studentName" placeholder="Student Name">
    <input id="courseYear" placeholder="Course Year">
    <button onclick="searchRecord()">Search</button>
  </div>

  <!-- Add Record -->
  <div class="section">
    <h3>Add New Record</h3>
    <input id="courseName" placeholder="Course Name">
    <input id="studentId" placeholder="Student ID">
    <input id="studentEmail" placeholder="Student Email">
    <input id="studentNameAdd" placeholder="Student Name">
    <input id="courseYearAdd" placeholder="Course Year">
    <button onclick="addRecord()">Add</button>
  </div>

  <div class="section">
    <h3>Response:</h3>
    <textarea id="output" readonly></textarea>
  </div>

  <script>
    // NOTE: API Gateway endpoint — no longer active (Learner Lab expired)
    const baseUrl = "https://qpgd1xipuf.execute-api.us-east-1.amazonaws.com/dev";

    async function searchAll() {
      const res = await fetch(`${baseUrl}/records`);
      document.getElementById('output').value = await res.text();
    }

    async function searchRecord() {
      const name = document.getElementById('studentName').value;
      const year = document.getElementById('courseYear').value;
      const res = await fetch(`${baseUrl}/${name}/${year}`);
      document.getElementById('output').value = await res.text();
    }

    async function addRecord() {
      const data = {
        course: document.getElementById('courseName').value,
        student_id: document.getElementById('studentId').value,
        student_email: document.getElementById('studentEmail').value,
        student: document.getElementById('studentNameAdd').value,
        year: document.getElementById('courseYearAdd').value
      };
      const res = await fetch(`${baseUrl}/records`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      document.getElementById('output').value = await res.text();
    }
  </script>
</body>
</html>
